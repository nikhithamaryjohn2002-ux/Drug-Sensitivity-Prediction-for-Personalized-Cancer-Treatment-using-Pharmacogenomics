<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* General Body and Background */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f4f7;
            color: #333;
            margin: 0;
            padding: 0;
        }

        /* Header Section */
        header {
            background: linear-gradient(to right, #0b79e8, #3da8ff);
            color: #fff;
            padding: 30px 20px;
            text-align: center;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 32px;
            margin: 0;
            font-weight: 600;
        }

        /* Fullscreen Background Image */
        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://png.pngtree.com/thumb_back/fh260/background/20230707/pngtree-d-rendering-of-health-content-medical-bottle-and-tablet-chart-for-image_3788536.jpg') no-repeat center center/cover;
            z-index: -1;
            filter: brightness(0.9);
        }

        /* Form Container */
        .form-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 100px);
            padding-top: 40px;
        }

        /* Login Box */
        .login-box {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 360px;
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 360px; /* Ensuring height for centered content */
        }

        .login-box h2 {
            font-size: 26px;
            color: #2c3e50;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* Form Fields */
        .input-field {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 16px;
            box-sizing: border-box;
        }

        .input-field:focus {
            border-color: #3498db;
            outline: none;
        }

        /* Submit Button */
        .submit-btn {
            background-color: #3498db;
            color: #fff;
            padding: 14px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 15px;
        }

        .submit-btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(52, 152, 219, 0.3);
        }

        /* Links */
        .link {
            text-align: center;
            margin-top: 10px;
        }

        .link a {
            color: #3498db;
            text-decoration: none;
            font-size: 16px;
        }

        .link a:hover {
            text-decoration: underline;
        }

        /* Flash Messages */
        .flash-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-size: 14px;
        }

        .flash-message.success {
            background-color: #d4edda;
            color: #155724;
        }

        @media (max-width: 500px) {
            .login-box {
                width: 90%;
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome Doctor!</h1>
    </header>

    <!-- Fullscreen Background Image -->
    <div class="background-image"></div>

    <div class="form-container">
        <div class="login-box">
            <h2>Login</h2>
            <form method="POST">
                <input class="input-field" type="email" name="email" placeholder="Enter Email" required><br>
                <input class="input-field" type="password" name="password" placeholder="Enter Password" required><br>
                <input class="submit-btn" type="submit" value="Login">
            </form>

            <div class="link">
                <p>Not registered yet? <a href="{{ url_for('register') }}">Register here</a></p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="flash-message">
                {% for category, message in messages %}
                <p>{{ message }}</p>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}
        </div>
    </div>

</body>

</html>
